name: goreleaser

on:
  push:
    # run only against tags
    tags:
      - 'v*'

permissions:
  contents: write
  # packages: write
  # issues: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Require tagged Pine dependency
        if: contains(github.ref_name, '-pine.')
        shell: bash
        run: |
          set -euo pipefail
          dependency="$(go list -m -f '{{with .Replace}}{{.Path}} {{.Version}}{{end}}' github.com/go-gost/x)"
          if [[ ! "$dependency" =~ ^github\.com/RunVid/gost-x\ v[0-9]+\.[0-9]+\.[0-9]+-pine\.[0-9]+$ ]]; then
            echo 'Pine releases require a tagged RunVid/gost-x dependency; review commit pins cannot ship.' >&2
            exit 1
          fi
      - name: Install UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true
      # More assembly might be required: Docker logins, GPG, etc. It all depends
      # on your needs.
      - uses: goreleaser/goreleaser-action@v6
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro':
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Your GoReleaser Pro key, if you are using the 'goreleaser-pro'
          # distribution:
          # GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
