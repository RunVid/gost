name: Pine executable contracts

on:
  pull_request:
    branches: [pine/v3.2.6]
  push:
    branches: [pine/v3.2.6]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Release dependency gate
        run: |
          bash .github/scripts/check-pine-dependency-test.sh
          bash .github/scripts/check-pine-dependency.sh
      - name: Vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Linux release builds
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          GOARCH=amd64 go build -trimpath -o /tmp/gost-linux-amd64 ./cmd/gost
          GOARCH=arm64 go build -trimpath -o /tmp/gost-linux-arm64 ./cmd/gost
